name: "Listen Later: make audio"

# Triggered by the picker page, which opens a pre-filled issue titled
# "Listen: ..." listing the article URLs. Only issues opened by the repo
# owner are acted on. It can also be run by hand from the Actions tab.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      urls:
        description: "Article URLs (space or newline separated)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: listen-later
  cancel-in-progress: false

jobs:
  make:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'Listen:') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: listen/tools/requirements.txt
      - run: pip install -r listen/tools/requirements.txt
      - name: Make episodes
        id: make
        env:
          # Passed through env (never pasted into the script) so issue text can't inject commands.
          REQUEST: ${{ github.event.issue.body || inputs.urls }}
        run: python listen/tools/make_episodes.py --from-text "$REQUEST"
      - name: Commit audio and feed
        if: always()
        run: |
          git config user.name "listen-later-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A listen/audio listen/episodes.json listen/feed.xml listen/candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Listen Later: new episodes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Report back on the request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.make.outcome }}
        run: |
          {
            if [ "$OUTCOME" = "success" ]; then echo "🎧 Your audio is ready (the feed updates within a few minutes):"; else echo "⚠️ Some articles couldn't be converted:"; fi
            echo
            cat listen/.last_report.md 2>/dev/null || echo "(no report — see the workflow log)"
          } > /tmp/report.md
          gh issue comment "$ISSUE" --body-file /tmp/report.md
          gh issue close "$ISSUE"
