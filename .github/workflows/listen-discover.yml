name: "Listen Later: find articles"

on:
  schedule:
    - cron: "17 10 * * *"      # every day, 10:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: listen-later          # never run alongside the audio maker (both commit)
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: listen/tools/requirements.txt
      - run: pip install -r listen/tools/requirements.txt
      - run: python listen/tools/discover.py
      - name: Commit new picks
        run: |
          git config user.name "listen-later-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listen/candidates.json
          git diff --cached --quiet && exit 0
          git commit -m "Listen Later: today's picks"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
